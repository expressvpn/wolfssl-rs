[package]
name = "wolfssl-sys"
version = "5.2.0"
description = "System bindings for WolfSSL"
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
links = "wolfssl"
exclude = [
    # crates.io has a size limit for publishing.
    # Exclude unused files to keep the size under the limit.
    # Note: Automake fails if include.am is removed, so put them back in.
    "wolfssl-src/**/*.pdf",
    "wolfssl-src/certs/**",
    "!wolfssl-src/certs/**/",
    "!wolfssl-src/certs/**/include.am",
    "!wolfssl-src/certs/taoCert.txt",
    "wolfssl-src/tests/**",
    "!wolfssl-src/tests/**/",
    "!wolfssl-src/tests/**/include.am",
]
edition.workspace = true

[build-dependencies]
bindgen = "0.73"
autotools = "0.2"
build-target = "0.8.0"
cc = "1"
built = { version = "0.8", default-features = false }

[target.'cfg(windows)'.build-dependencies]
msbuild = "0.2.0"

[dev-dependencies]
test-case = "3.0"

[features]
default = ["postquantum"]
debug = []
postquantum = []
system_ca_certs = []
# Configure feature flags
aesccm = []
dh = []
opensslall = []
opensslextra = []
psk = []
# Define feature flags
ex_data = []
alpn = []

[[example]]
name = "connect_pq"
required-features = ["postquantum"]
